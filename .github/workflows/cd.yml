name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  POSTGRES_DB: crm_chatbot
  POSTGRES_USER: ci_user
  POSTGRES_PASSWORD: ci_password

jobs:
  publish-images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
      sha: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish immutable frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release-smoke:
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ needs.publish-images.outputs.backend }}:${{ needs.publish-images.outputs.sha }}
      FRONTEND_IMAGE: ${{ needs.publish-images.outputs.frontend }}:${{ needs.publish-images.outputs.sha }}
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@db:5432/crm_chatbot

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up release environment
        shell: bash
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg://ci_user:ci_password@db:5432/crm_chatbot
          ENVIRONMENT=development
          AUTH_SECRET=ci-only-auth-secret
          CHANNEL_ENCRYPTION_KEY=ci-only-channel-key
          RAG_AUTO_SEED_ENABLED=false
          RAG_AUTO_REPLY_ENABLED=false
          EMBEDDING_PROVIDER=local
          CORS_ORIGINS=http://localhost:5173
          ALLOWED_HOSTS=*
          EOF
          cat > docker-compose.release.yml <<'EOF'
          services:
            backend:
              image: ${BACKEND_IMAGE}
              pull_policy: always
            frontend:
              image: ${FRONTEND_IMAGE}
              pull_policy: always
          EOF
          docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet

      - name: Pull verified images
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml pull backend frontend

      - name: Run migrations before rollout
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml run --rm backend alembic upgrade head

      - name: Start verified release
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml up -d backend frontend

      - name: Verify release health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            backend_status=$(docker inspect --format '{{.State.Health.Status}}' crm_chatbot_backend 2>/dev/null || true)
            frontend_status=$(docker inspect --format '{{.State.Health.Status}}' crm_chatbot_frontend 2>/dev/null || true)
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose -f docker-compose.yml -f docker-compose.release.yml ps
              docker compose -f docker-compose.yml -f docker-compose.release.yml logs --no-color db backend frontend
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:5173/
          docker compose -f docker-compose.yml -f docker-compose.release.yml ps

      - name: Collect release logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml logs --no-color db backend frontend

      - name: Tear down release stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml down --volumes --remove-orphans

  promote-latest:
    needs: [publish-images, release-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote verified backend image to latest
        run: docker buildx imagetools create --tag "${{ needs.publish-images.outputs.backend }}:latest" "${{ needs.publish-images.outputs.backend }}:${{ needs.publish-images.outputs.sha }}"

      - name: Promote verified frontend image to latest
        run: docker buildx imagetools create --tag "${{ needs.publish-images.outputs.frontend }}:latest" "${{ needs.publish-images.outputs.frontend }}:${{ needs.publish-images.outputs.sha }}"
