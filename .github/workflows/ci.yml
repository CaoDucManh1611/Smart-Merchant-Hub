name: CI

on:
  push:
    branches: [main, develop, crm-completion]
  pull_request:
    branches: [main, develop, crm-completion]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: crm_chatbot
  POSTGRES_USER: ci_user
  POSTGRES_PASSWORD: ci_password
  DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/crm_chatbot
  RAG_AUTO_SEED_ENABLED: "false"
  RAG_AUTO_REPLY_ENABLED: "false"

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: crm_chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d crm_chatbot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migration head and model drift
        working-directory: backend
        run: |
          python -m alembic current
          python -m alembic heads
          python -m alembic check

      - name: Compile backend sources
        working-directory: backend
        run: python -m compileall -q app alembic tests

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-smoke:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: crm_chatbot
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@db:5432/crm_chatbot

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Compose configuration
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg://ci_user:ci_password@db:5432/crm_chatbot
          ENVIRONMENT=development
          AUTH_SECRET=ci-only-auth-secret
          CHANNEL_ENCRYPTION_KEY=ci-only-channel-key
          RAG_AUTO_SEED_ENABLED=false
          RAG_AUTO_REPLY_ENABLED=false
          EMBEDDING_PROVIDER=local
          CORS_ORIGINS=http://localhost:5173
          ALLOWED_HOSTS=*
          EOF
          docker compose config --quiet

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for service health
        run: |
          for attempt in $(seq 1 30); do
            backend_status=$(docker inspect --format '{{.State.Health.Status}}' crm_chatbot_backend 2>/dev/null || true)
            frontend_status=$(docker inspect --format '{{.State.Health.Status}}' crm_chatbot_frontend 2>/dev/null || true)
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose ps
              docker compose logs --no-color db backend frontend
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:5173/
          docker compose ps

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  docker-build:
    needs: [backend-test, frontend-test, compose-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: smart-merchant-hub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: smart-merchant-hub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
