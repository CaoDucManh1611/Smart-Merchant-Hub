[pytest]
pythonpath = .
testpaths = tests
# The bundled test runtime currently ships Starlette's compatibility
# TestClient path (httpx 0.28 + AnyIO 4). These two warnings originate in
# that third-party adapter; production code is not using the deprecated APIs.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
